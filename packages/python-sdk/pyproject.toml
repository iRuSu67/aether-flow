[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherflow"
version = "1.0.0"
description = "Python SDK for AetherFlow Autonomous Multi-Agent Microkernel & JIT Tool Synthesis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "iRuSu67" }]
keywords = ["agents", "multi-agent", "swarm", "ai", "mcp", "hegelian-consensus", "tool-synthesis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "httpx>=0.25.0",
    "websockets>=12.0",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/iRuSu67/aether-flow"
Repository = "https://github.com/iRuSu67/aether-flow"
